[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-lab-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.6",
    "anthropic>=0.34.2",
    "pdfplumber>=0.11.4",
    "pypdf>=4.3.1",
    "langchain-text-splitters>=0.2.4",
    "voyageai>=0.3.2",
    "hdbscan>=0.8.38.post1",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "httpx>=0.27.0",
    "ruff>=0.6.2",
]
