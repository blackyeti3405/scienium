version: "3.9"

# Local dev only: Postgres for the Next.js app. (Production uses managed Postgres.)
# The former redis + ai-service containers were removed — all AI work now runs
# directly in Next.js API routes via the Anthropic SDK.
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nova_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
